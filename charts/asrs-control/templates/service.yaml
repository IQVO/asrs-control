apiVersion: v1
kind: Service
metadata:
  name: {{ include "asrs-control.fullname" . }}
  labels:
    {{- include "asrs-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "asrs-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
