{{- if and .Values.a2a.enabled (not (include "asrs-control.agentsColocated" .)) }}
{{- include "asrs-control.require" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asrs-control.a2aFullname" . }}
  labels:
    {{- include "asrs-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  annotations:
    # agents.colocate cutover (ADR 0012): ArgoCD prunes this Deployment only after <release>-agents serves.
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "asrs-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "asrs-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "asrs-control.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "asrs-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract = exactly what cmd/a2a reads (render_test.sh scans it). Read-only: no
          # Kafka, no MQTT, no outbox; the api ConfigMap is NOT mounted as env, only its
          # layout.yaml key as a file, so no api variable leaks in.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # The URL the Agent Card advertises: a2a.agentUrl, else this release's Service DNS name.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "asrs-control.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: ASRS_LAYOUT_FILE
              value: {{ .Values.config.layoutFile | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ include "asrs-control.serviceVersion" . | quote }}
            {{- if and .Values.otel.enabled .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "asrs-control.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "asrs-control.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          volumeMounts:
            - name: layout
              mountPath: {{ dir .Values.config.layoutFile }}
              readOnly: true
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      volumes:
        - name: layout
          configMap:
            name: {{ include "asrs-control.fullname" . }}
            items:
              - key: layout.yaml
                path: {{ base .Values.config.layoutFile }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
