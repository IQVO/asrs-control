{{- /*
Kong plugins owned by this application's chart.

Fleet decision (2026-10-13): ALL Kong configuration, routes AND plugins, belongs to the application's Helm chart, not
warehouse-infra Terraform. Cluster-wide KongClusterPlugins applied by null_resource + kubectl silently vanished on a
cluster rebuild because local-exec provisioners only run when their triggers change; chart-rendered objects are
Helm/ArgoCD reconciled forever. Namespace-scoped KongPlugin CRs here are the same mechanism, self-healing.

Three plugins, one per concern, attached per route via the `konghq.com/plugins` annotation on this chart's own
HTTPRoute templates (api, mcp, a2a):

  cors          the split localhost edge: assets on http://localhost, APIs on http://localhost:8000 are different
                origins, so every browser call is cross-origin. Exact origin only, NEVER "*": the endpoints are
                unauthenticated.
  prometheus    per-route RED metrics (kong_http_requests_total, kong_latency_bucket, ...) on Kong's status listener.
  opentelemetry OTLP traces to the fleet collector. Kong itself must also run with KONG_TRACING_INSTRUMENTATIONS (set
                on the kong release in warehouse-infra): the plugin ships spans, the env var makes Kong generate them.

No plugin that checks credentials, deliberately: it was removed fleet-wide and the gateway adds none.

All three default `enabled: false` and are switched on by warehouse-infra's values, so this chart stays installable
standalone.
*/ -}}
{{- range $name, $cfg := .Values.kongPlugins }}
{{- if $cfg.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ printf "%s-%s" (include "asrs-control.fullname" $) $name }}
  labels:
    {{- include "asrs-control.labels" $ | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: kong
{{- if eq $name "cors" }}
plugin: cors
config:
  origins:
    - {{ $cfg.origin | quote }}
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Content-Type
    - Origin
    # Custom request headers are not CORS-safelisted: browser clients POST with an Idempotency-Key header (every
    # asrs-control POST takes one) and conditional writes send If-Match, so the preflight must allow them or the
    # browser blocks the call before it reaches Kong.
    - Idempotency-Key
    - If-Match
  exposed_headers:
    - Content-Length
    # The client reads the ETag for If-Match and the replay marker of a repeated Idempotency-Key.
    - ETag
    - Idempotency-Replayed
    # MCP Streamable HTTP clients read the session id from the response (cmd/mcp is stateless and issues none, but
    # the fleet plugin is uniform).
    - Mcp-Session-Id
  credentials: false
  max_age: 3600
  preflight_continue: false
{{- else if eq $name "prometheus" }}
plugin: prometheus
config:
  per_consumer: false
  status_code_metrics: true
  latency_metrics: true
  bandwidth_metrics: true
  upstream_health_metrics: true
{{- else if eq $name "opentelemetry" }}
plugin: opentelemetry
config:
  traces_endpoint: {{ $cfg.tracesEndpoint | quote }}
  resource_attributes:
    service.name: {{ printf "%s-kong" (include "asrs-control.fullname" $) | quote }}
  propagation:
    default_format: w3c
{{- else }}
{{- fail (printf "kongPlugins.%s is not a plugin this chart renders (cors, prometheus, opentelemetry)" $name) }}
{{- end }}
---
{{- end }}
{{- end }}
