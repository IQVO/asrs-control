{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through the gateway (fleet decision 2026-10-13: gateway config lives in the application charts).

Host contract: /api/a2a/asrs-control -> Service asrs-control-a2a:8093, prefix rewritten to / (the Agent Card stays
reachable under the same prefix at /api/a2a/asrs-control/.well-known/agent-card.json and JSON-RPC at the prefix
itself). The card advertises A2A_AGENT_URL (a2a.agentUrl): set it to the gateway URL when agents outside the cluster
dial through Kong. No credential plugin on the route (fleet-wide revert 2026-09-11).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "asrs-control.a2aFullname" . }}
  labels:
    {{- include "asrs-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "asrs-control.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ required "every Gateway parentRef needs a name (warehouse-infra sets it)" .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "asrs-control.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
