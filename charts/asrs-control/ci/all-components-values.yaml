# Used by `helm lint` / `ct lint`: every optional value of the chart set at once.
# asrs-control has one component (api) and no optional workload (no MCP, A2A,
# frontend, analytics or gateway route yet), so this file exercises the optional
# paths of that one Deployment: the database from an existing Secret with the
# migrations key, the MQTT client id, every config.* value, a two-AS/RS layout,
# extra env, pod annotations/labels and scheduling. Dummy values, no password;
# nothing here is ever dialled.
database:
  existingSecret: "asrs-control-db"
  existingSecretKey: "DATABASE_URL"
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
kafka:
  brokers: "kafka-0.kafka.warehouse-systems.svc.cluster.local:9092,kafka-1.kafka.warehouse-systems.svc.cluster.local:9092"
mqtt:
  url: "tcp://mosquitto.warehouse-systems.svc.cluster.local:1883"
  clientId: "asrs-control-ci"
config:
  addr: ":8080"
  logLevel: "debug"
  layoutFile: /etc/asrs-control/layout.yaml
  outboxIntervalMs: "500"
  outboxBatch: "50"
  outboxMaxAttempts: "10"
  velocityWindowHours: "72"
  velocityFastRetrievals: "5"
layout:
  asrs:
    - id: ASRS1
      aisles: 2
      levels: 8
      slots: 40
      doubleDeep: true
      cost: {perLevel: 1.5, perSlot: 0.2}
      ports:
        - {id: IN1, aisle: 1, kind: INPUT}
        - {id: OUT1, aisle: 1, kind: OUTPUT}
        - {id: IN2, aisle: 2, kind: INPUT}
        - {id: OUT2, aisle: 2, kind: OUTPUT}
    - id: ASRS2
      aisles: 1
      levels: 4
      slots: 20
      doubleDeep: false
      cost: {perLevel: 1.0, perSlot: 0.1}
      ports:
        - {id: IN1, aisle: 1, kind: INPUT}
        - {id: OUT1, aisle: 1, kind: OUTPUT}
extraEnv:
  - name: GOMAXPROCS
    value: "2"
podAnnotations:
  example.invalid/ci: "all-components"
podLabels:
  example.invalid/tier: wcs
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: example.invalid/dedicated
    operator: Equal
    value: wcs
    effect: NoSchedule
